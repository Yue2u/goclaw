syntax = "proto3";
package filestore.v1;
option go_package = "github.com/nextlevelbuilder/goclaw/filestore/gen/filestore/v1;filestorev1";

service FileStore {
  rpc Put(stream PutChunk) returns (PutResponse);
  rpc Get(GetRequest) returns (stream DataChunk);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc TotalSize(TotalSizeRequest) returns (TotalSizeResponse);
}

message PutChunk {
  oneof data {
    PutMeta meta  = 1;
    bytes   chunk = 2;
  }
}
message PutMeta {
  string tenant_slug   = 1;
  string path          = 2;
  string content_type  = 3;
  int64  size          = 4;
}
message PutResponse      { string key = 1; }
message GetRequest       { string tenant_slug = 1; string path = 2; }
message DataChunk        { bytes data = 1; }
message DeleteRequest    { string tenant_slug = 1; string path = 2; bool recursive = 3; }
message DeleteResponse   {}
message MoveRequest      { string tenant_slug = 1; string from = 2; string to = 3; }
message MoveResponse     {}
message ListRequest      { string tenant_slug = 1; string path = 2; int32 max_depth = 3; }
message ListResponse     { repeated Entry entries = 1; }
message Entry {
  string path          = 1;
  string name          = 2;
  bool   is_dir        = 3;
  int64  size          = 4;
  int64  mod_time_unix = 5;
  bool   has_children  = 6;
}
message StatRequest      { string tenant_slug = 1; string path = 2; }
message StatResponse     { Entry entry = 1; }
message TotalSizeRequest  { string tenant_slug = 1; }
message TotalSizeResponse { int64 bytes = 1; }
